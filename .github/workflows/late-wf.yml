name: v52-late-walk-forward
on:
  pull_request:
    branches: [master]
    paths:
      - 'research/v52_late_walkforward_prereg.json'
      - 'backtest_v52/late_walkforward.py'
      - 'backtest_v52/late_walkforward_fast.py'
      - '.github/workflows/late-wf.yml'
permissions:
  contents: read
jobs:
  preprice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests beautifulsoup4 yfinance exchange_calendars
      - name: Fetch 2021-12-30 JPX stock-list snapshot
        run: |
          git clone --depth 1 https://github.com/RonBeiden/jpx-stock-prediction.git external/jpx-list
          ls -lh external/jpx-list/data/raw/train/stock_list.csv
      - name: Build and freeze official-JPX fundamental table before any price retrieval
        run: |
          python backtest_v52/late_walkforward_fast.py fundamentals \
            --stock-list external/jpx-list/data/raw/train/stock_list.csv \
            --out-dir artifacts/v52-late-preprice
          cat artifacts/v52-late-preprice/preprice_manifest.json
      - name: Upload immutable pre-price table
        uses: actions/upload-artifact@v4
        with:
          name: v52-late-preprice-frozen
          path: artifacts/v52-late-preprice
          if-no-files-found: error
          retention-days: 30

  prices-and-results:
    needs: preprice
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests beautifulsoup4 yfinance exchange_calendars
      - name: Download frozen pre-price table
        uses: actions/download-artifact@v4
        with:
          name: v52-late-preprice-frozen
          path: artifacts/v52-late-preprice
      - name: Verify freeze then fetch prices and run fixed WF-05 to WF-08
        run: |
          test -s artifacts/v52-late-preprice/preprice_manifest.json
          sha256sum artifacts/v52-late-preprice/fundamentals_preprice.csv
          python backtest_v52/late_walkforward_fast.py prices-run \
            --pre-dir artifacts/v52-late-preprice \
            --out-dir artifacts/v52-late-results
      - name: Upload late walk-forward results
        uses: actions/upload-artifact@v4
        with:
          name: v52-late-walk-forward-results
          path: artifacts/v52-late-results
          if-no-files-found: error
          retention-days: 30
