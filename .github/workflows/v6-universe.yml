name: v6-pit-universe
on:
  pull_request:
  workflow_dispatch:
jobs:
  universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip requests
      - name: Build 2023-07-31 PIT universe candidate
        run: python backtest_v6/build_pit_universe.py --out-dir artifacts/v6-universe --allow-count-mismatch
      - name: Upload universe
        uses: actions/upload-artifact@v4
        with:
          name: v6-pit-universe-diagnostics
          path: artifacts/v6-universe
          retention-days: 30
  disclosures:
    needs: universe
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip pandas numpy requests beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          name: v6-pit-universe-diagnostics
          path: artifacts/v6-universe
      - name: Fetch all JPX historical disclosures for shard
        run: |
          mkdir -p artifacts/shard
          python backtest_v6/fetch_disclosures.py \
            --universe artifacts/v6-universe/v6_universe_20230731_candidate.csv \
            --out artifacts/shard/disclosures_${{ matrix.shard }}.csv \
            --start 2023-08-01 --end 2024-07-31 \
            --shards 8 --shard ${{ matrix.shard }} --workers 4 --retries 2 --allow-errors
      - name: Freeze primary-source fundamental scores before price
        run: |
          python backtest_v6/score_core.py \
            --disclosures artifacts/shard/disclosures_${{ matrix.shard }}.csv \
            --out artifacts/shard/fundamentals_${{ matrix.shard }}.csv --workers 4
      - uses: actions/upload-artifact@v4
        with:
          name: v6-shard-${{ matrix.shard }}
          path: artifacts/shard
          retention-days: 30
  merge:
    needs: disclosures
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: v6-shard-*
          path: artifacts/shards
      - run: python backtest_v6/merge_shards.py --root artifacts/shards --out-dir artifacts/v6-frozen
      - uses: actions/upload-artifact@v4
        with:
          name: v6-frozen-fundamentals
          path: artifacts/v6-frozen
          retention-days: 30
