name: inspect-jpx-company-search
on:
  pull_request:
    branches: [master]
    paths:
      - 'backtest_v52/inspect_jpx_company_search.sh'
      - 'backtest_v52/inspect_jpx_company_search_forms.py'
      - 'backtest_v52/inspect_jpx_www2.py'
      - 'backtest_v52/test_jpx_search.py'
      - 'backtest_v52/test_jpx_detail.py'
      - 'backtest_v52/test_jpx_direct_detail.py'
      - 'backtest_v52/inspect_ixbrl.py'
      - 'backtest_v52/inspect_revision_row.py'
      - 'backtest_v6/build_pit_universe.py'
      - '.github/workflows/inspect-jpx-company-search.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4 requests
      - run: bash backtest_v52/inspect_jpx_company_search.sh
      - run: python backtest_v52/inspect_jpx_company_search_forms.py
      - run: python backtest_v52/inspect_jpx_www2.py
      - run: python backtest_v52/test_jpx_search.py
      - run: python backtest_v52/test_jpx_detail.py
      - run: python backtest_v52/test_jpx_direct_detail.py
      - run: python backtest_v52/inspect_ixbrl.py
      - run: python backtest_v52/inspect_revision_row.py
      - name: Build v6 PIT universe diagnostic
        run: python backtest_v6/build_pit_universe.py --out-dir artifacts/v6-universe --allow-count-mismatch
      - name: Upload v6 PIT universe diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v6-pit-universe-diagnostics
          path: artifacts/v6-universe
          retention-days: 30
