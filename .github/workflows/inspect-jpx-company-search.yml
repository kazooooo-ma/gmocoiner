name: inspect-jpx-company-search
on:
  pull_request:
    branches: [backtest-v52-20260822]
    paths:
      - 'backtest_v6/**'
      - 'backtest_v52/inspect_jpx_company_search.sh'
      - 'backtest_v52/inspect_jpx_company_search_forms.py'
      - 'backtest_v52/inspect_jpx_www2.py'
      - 'backtest_v52/test_jpx_search.py'
      - 'backtest_v52/test_jpx_detail.py'
      - 'backtest_v52/test_jpx_direct_detail.py'
      - 'backtest_v52/inspect_ixbrl.py'
      - 'backtest_v52/inspect_revision_row.py'
      - '.github/workflows/inspect-jpx-company-search.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install --upgrade beautifulsoup4 requests pandas numpy yfinance
      - name: Build V6 PIT universe
        run: python backtest_v6/build_pit_universe.py --out-dir artifacts/v6-universe --allow-count-mismatch
      - name: Basic JPX company service inspection
        run: |
          python backtest_v52/test_jpx_search.py
          python backtest_v52/test_jpx_detail.py
      - name: Upload V6 universe audit
        uses: actions/upload-artifact@v4
        with:
          name: v6-universe-audit
          path: artifacts/v6-universe
          if-no-files-found: error
          retention-days: 30
