name: Japan factor profitability backtest v2

on:
  push:
    branches:
      - research/japan-factor-profitability-20260902
    paths:
      - .github/workflows/japan-factor-profitability-v2.yml

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out frozen research branch
        uses: actions/checkout@v4
        with:
          ref: research/japan-factor-profitability-20260902
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install compatible pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pandas==2.2.3 \
            numpy==2.1.3 \
            scipy==1.14.1 \
            statsmodels==0.14.4 \
            pandas-datareader==0.10.0 \
            tabulate==0.9.0

      - name: Download official data and execute frozen test
        id: test
        env:
          OUTPUT_DIR: factor_backtest_output
        run: |
          mkdir -p factor_backtest_output
          set +e
          python - <<'PY' > factor_backtest_output/run.log 2>&1
          import runpy
          import pandas_datareader.famafrench as famafrench
          famafrench._URL = 'https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/'
          runpy.run_path('research/japan_factor_incremental_backtest.py', run_name='__main__')
          PY
          rc=$?
          set -e
          cat factor_backtest_output/run.log
          cp research/japan_factor_incremental_backtest.py factor_backtest_output/
          cp research/japan_factor_profitability_prereg.json factor_backtest_output/
          printf '%s\n' "$rc" > factor_backtest_output/exit_code.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Commit durable evidence
        if: always()
        run: |
          rm -rf research/results/japan_factor_profitability_20260902_v2
          mkdir -p research/results
          cp -R factor_backtest_output research/results/japan_factor_profitability_20260902_v2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/results/japan_factor_profitability_20260902_v2
          git commit -m "Record Japan factor profitability backtest v2 evidence"
          git push origin HEAD:research/japan-factor-profitability-20260902

      - name: Upload complete evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-factor-profitability-backtest-v2
          path: factor_backtest_output/
          if-no-files-found: error
          retention-days: 30

      - name: Fail only after evidence is durable
        if: steps.test.outputs.rc != '0'
        run: exit 1
