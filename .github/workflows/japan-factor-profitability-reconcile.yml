name: Reconcile Japan factor profitability evidence

on:
  push:
    branches:
      - research/japan-factor-profitability-20260902
    paths:
      - .github/workflows/japan-factor-profitability-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/japan-factor-profitability-20260902
          fetch-depth: 0

      - name: Stop when durable success already exists
        id: existing
        run: |
          if [ -s research/results/japan_factor_profitability_20260902/decision.json ] && \
             [ "$(cat research/results/japan_factor_profitability_20260902/exit_code.txt 2>/dev/null)" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            cat research/results/japan_factor_profitability_20260902/decision.json
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        if: steps.existing.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.2.3 numpy==2.1.3 statsmodels==0.14.4 pandas-datareader==0.10.0 tabulate==0.9.0

      - name: Execute and capture all evidence
        if: steps.existing.outputs.skip != 'true'
        id: test
        env:
          OUTPUT_DIR: factor_backtest_output
        run: |
          mkdir -p factor_backtest_output
          set +e
          python research/japan_factor_incremental_backtest.py > factor_backtest_output/run.log 2>&1
          rc=$?
          set -e
          cat factor_backtest_output/run.log
          cp research/japan_factor_incremental_backtest.py factor_backtest_output/
          cp research/japan_factor_profitability_prereg.json factor_backtest_output/
          printf '%s\n' "$rc" > factor_backtest_output/exit_code.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Publish durable evidence once
        if: steps.existing.outputs.skip != 'true' && always()
        run: |
          rm -rf research/results/japan_factor_profitability_20260902
          mkdir -p research/results
          cp -R factor_backtest_output research/results/japan_factor_profitability_20260902
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/results/japan_factor_profitability_20260902
          git commit -m "Record Japan factor profitability backtest evidence"
          git push origin HEAD:research/japan-factor-profitability-20260902

      - name: Preserve artifact
        if: steps.existing.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-factor-profitability-backtest-reconciled
          path: factor_backtest_output/
          if-no-files-found: error
          retention-days: 30

      - name: Fail only after evidence is durable
        if: steps.existing.outputs.skip != 'true' && steps.test.outputs.rc != '0'
        run: exit 1
