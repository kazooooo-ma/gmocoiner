name: Japan factor profitability backtest

on:
  push:
    branches:
      - research/japan-factor-profitability-20260902-r2
    paths:
      - research/japan_factor_incremental_backtest_r2.py.gz.b64
      - research/japan_factor_profitability_prereg.json
      - .github/workflows/japan-factor-profitability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out fixed research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pandas==2.3.2 \
            numpy==2.3.2 \
            scipy==1.16.1 \
            statsmodels==0.14.5 \
            matplotlib==3.10.6 \
            tabulate==0.9.0

      - name: Restore and verify corrected implementation
        run: |
          base64 --decode research/japan_factor_incremental_backtest_r2.py.gz.b64 \
            | gzip --decompress > research/japan_factor_incremental_backtest.py
          echo 'f6657d2b3df80eea17cdf9dd81a85ec855f2974f8092f3f830496ce441de1416  research/japan_factor_incremental_backtest.py' \
            | sha256sum --check --strict
          python -m py_compile research/japan_factor_incremental_backtest.py

      - name: Download official data and run preregistered backtest
        env:
          OUTPUT_DIR: factor_backtest_output
        run: python research/japan_factor_incremental_backtest.py

      - name: Preserve executed implementation and preregistration
        if: always()
        run: |
          mkdir -p factor_backtest_output
          if test -f research/japan_factor_incremental_backtest.py; then
            cp research/japan_factor_incremental_backtest.py factor_backtest_output/executed_backtest.py
          fi
          cp research/japan_factor_profitability_prereg.json factor_backtest_output/preregistration.json

      - name: Upload complete research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-factor-profitability-backtest-r2
          path: factor_backtest_output/
          if-no-files-found: error
          retention-days: 30
