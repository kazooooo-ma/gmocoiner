name: Japan factor profitability backtest

on:
  push:
    branches:
      - research/japan-factor-profitability-20260902
    paths:
      - research/japan_factor_incremental_backtest.py
      - research/run_japan_factor_incremental_backtest.py
      - research/japan_factor_profitability_prereg.json
      - .github/workflows/japan-factor-profitability.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out frozen research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pandas==2.2.3 \
            numpy==2.1.3 \
            scipy==1.14.1 \
            statsmodels==0.14.4 \
            pandas-datareader==0.10.0 \
            tabulate==0.9.0

      - name: Download official data and execute frozen test
        id: execute
        continue-on-error: true
        env:
          OUTPUT_DIR: factor_backtest_output
        run: |
          mkdir -p factor_backtest_output
          set +e
          python research/run_japan_factor_incremental_backtest.py \
            > factor_backtest_output/run.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > factor_backtest_output/exit_code.txt
          cat factor_backtest_output/run.log
          exit "$code"

      - name: Preserve executed implementation and preregistration
        if: always()
        run: |
          mkdir -p factor_backtest_output
          cp research/japan_factor_incremental_backtest.py factor_backtest_output/executed_backtest.py
          cp research/run_japan_factor_incremental_backtest.py factor_backtest_output/execution_wrapper.py
          cp research/japan_factor_profitability_prereg.json factor_backtest_output/preregistration.json
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
          } > factor_backtest_output/workflow_identity.txt

      - name: Publish durable text evidence to branch
        if: always()
        run: |
          dest=research/results/japan_factor_profitability_20260902
          mkdir -p "$dest"
          find factor_backtest_output -maxdepth 1 -type f \
            \( -name '*.json' -o -name '*.csv' -o -name '*.md' -o -name '*.txt' -o -name '*.log' -o -name '*.py' \) \
            -exec cp {} "$dest"/ \;
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"
          if git diff --cached --quiet; then
            echo 'No new durable evidence to publish.'
          else
            git commit -m "Publish Japan factor profitability backtest evidence [skip ci]"
            git push
          fi

      - name: Upload complete evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-factor-profitability-backtest
          path: factor_backtest_output/
          if-no-files-found: error
          retention-days: 30

      - name: Fail when frozen test failed
        if: steps.execute.outcome == 'failure'
        run: exit 1
