name: Japan factor profitability backtest

on:
  push:
    branches:
      - research/japan-factor-profitability-20260902
    paths:
      - research/japan_factor_incremental_backtest.py
      - research/japan_factor_profitability_prereg.json
      - .github/workflows/japan-factor-profitability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out frozen research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pandas==2.2.3 \
            numpy==2.1.3 \
            statsmodels==0.14.4 \
            pandas-datareader==0.10.0 \
            tabulate==0.9.0

      - name: Download official data and execute frozen test
        env:
          OUTPUT_DIR: factor_backtest_output
        run: |
          python research/japan_factor_incremental_backtest.py
          cp research/japan_factor_incremental_backtest.py factor_backtest_output/
          cp research/japan_factor_profitability_prereg.json factor_backtest_output/

      - name: Upload complete evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-factor-profitability-backtest
          path: factor_backtest_output/
          if-no-files-found: error
          retention-days: 30
