name: backtest-v52-public
on:
  pull_request:
    branches: [master]
    paths:
      - 'backtest_v52/**'
      - 'docs/v5_2_methodology_and_walk_forward_ja.md'
      - '.github/workflows/backtest-smoke.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Fetch full JPX competition history
        run: |
          git lfs version
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/1on1pt/JPX_Tokyo_Stock_Exchange_Prediction.git external/jpx-full
          git -C external/jpx-full lfs pull --include="train_files/stock_prices.csv,train_files/financials.csv"
          git clone --depth 1 https://github.com/RonBeiden/jpx-stock-prediction.git external/jpx-list
          mkdir -p external/jpx-data
          cp external/jpx-full/train_files/stock_prices.csv external/jpx-data/stock_prices.csv
          cp external/jpx-full/train_files/financials.csv external/jpx-data/financials.csv
          cp external/jpx-list/data/raw/train/stock_list.csv external/jpx-data/stock_list.csv
          ls -lh external/jpx-data
      - name: Append TOPIX ETF benchmark
        run: |
          python backtest_v52/fetch_benchmark.py --price-file external/jpx-data/stock_prices.csv
      - name: Diagnose point-in-time coverage
        run: |
          python backtest_v52/diagnose_data.py --data-dir external/jpx-data
      - name: Run reference holdout
        run: |
          python backtest_v52/run_wrapper.py --data-dir external/jpx-data --out-dir artifacts/v52
      - name: Run pre-registered fixed-rule walk-forward windows
        run: |
          mkdir -p artifacts/walk-forward
          python backtest_v52/run_window.py --base 2017-03-31 --end 2018-03-30 --data-dir external/jpx-data --out-dir artifacts/walk-forward/WF-01
          python backtest_v52/run_window.py --base 2018-03-30 --end 2019-03-29 --data-dir external/jpx-data --out-dir artifacts/walk-forward/WF-02
          python backtest_v52/run_window.py --base 2019-03-29 --end 2020-03-31 --data-dir external/jpx-data --out-dir artifacts/walk-forward/WF-03
          python backtest_v52/run_window.py --base 2021-07-30 --end 2022-06-24 --data-dir external/jpx-data --out-dir artifacts/walk-forward/WF-04
          python backtest_v52/summarize_walk_forward.py --root artifacts/walk-forward
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-v52-and-walk-forward-results
          path: |
            artifacts/v52
            artifacts/walk-forward
          if-no-files-found: error
          retention-days: 30
