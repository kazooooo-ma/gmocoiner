name: backtest-v52-public
on:
  pull_request:
    branches: [master]
    paths:
      - 'backtest_v52/**'
      - '.github/workflows/backtest-smoke.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Fetch JPX competition data mirror
        run: |
          git clone --depth 1 https://github.com/RonBeiden/jpx-stock-prediction.git external/jpx
          ls -lh external/jpx/data/raw/train
      - name: Append TOPIX ETF benchmark
        run: |
          python backtest_v52/fetch_benchmark.py --price-file external/jpx/data/raw/train/stock_prices.csv
      - name: Diagnose point-in-time coverage
        run: |
          python backtest_v52/diagnose_data.py --data-dir external/jpx/data/raw/train
      - name: Run locked holdout
        run: |
          python backtest_v52/run_wrapper.py --data-dir external/jpx/data/raw/train --out-dir artifacts/v52
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-v52-results
          path: artifacts/v52
          if-no-files-found: error
          retention-days: 30
