name: v51-expanded-first-section-proxy
on:
  pull_request:
    branches: [master]
    paths:
      - 'backtest_v51_proxy/**'
      - '.github/workflows/v51-expanded-proxy.yml'
permissions:
  contents: read
jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Fetch core and secondary JPX competition history
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/1on1pt/JPX_Tokyo_Stock_Exchange_Prediction.git external/jpx-full
          git -C external/jpx-full lfs pull --include="train_files/stock_prices.csv,train_files/secondary_stock_prices.csv,train_files/financials.csv"
          git clone --depth 1 https://github.com/RonBeiden/jpx-stock-prediction.git external/jpx-list
          mkdir -p external/jpx-data
          cp external/jpx-full/train_files/financials.csv external/jpx-data/financials.csv
          cp external/jpx-list/data/raw/train/stock_list.csv external/jpx-data/stock_list.csv
          python - <<'PY'
          import pandas as pd
          a=pd.read_csv('external/jpx-full/train_files/stock_prices.csv')
          b=pd.read_csv('external/jpx-full/train_files/secondary_stock_prices.csv')
          x=pd.concat([a,b],ignore_index=True,sort=False)
          x=x.sort_values(['Date','SecuritiesCode']).drop_duplicates(['Date','SecuritiesCode'],keep='first')
          x.to_csv('external/jpx-data/stock_prices.csv',index=False)
          print('core',a.shape,'secondary',b.shape,'merged',x.shape,'codes',x.SecuritiesCode.nunique())
          PY
      - name: Append TOPIX ETF benchmark
        run: python backtest_v52/fetch_benchmark.py --price-file external/jpx-data/stock_prices.csv
      - name: Run expanded v5.1 First Section proxy
        run: python backtest_v51_proxy/run_first_section_proxy.py --data-dir external/jpx-data --out-dir artifacts/v51-expanded-first-section-proxy
      - name: Upload expanded proxy result
        uses: actions/upload-artifact@v4
        with:
          name: v51-expanded-first-section-proxy-result
          path: artifacts/v51-expanded-first-section-proxy
          if-no-files-found: error
          retention-days: 30
